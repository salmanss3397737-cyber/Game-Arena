/* =====================================
   RANDOM SHUFFLE
   ===================================== */

function shuffleArray(array){

  for(let i=array.length-1;i>0;i--){

    const j=Math.floor(Math.random()*(i+1));

    [array[i],array[j]]=[array[j],array[i]];

  }

}


/* =====================================
   QUIZ VARIABLES
   ===================================== */

let quizQuestions=[];
let currentQuestion=0;
let score=0;
let answered=false;


/* =====================================
   START QUIZ
   ===================================== */

function startQuiz(){

  quizQuestions=questions.map(function(q){

    return{
      subject:q.subject,
      q:q.q,
      options:[...q.options],
      answer:q.answer
    };

  });


  /* Questions random */

  shuffleArray(quizQuestions);


  /* Options random */

  quizQuestions.forEach(function(q){

    const correctAnswer=q.options[q.answer];

    shuffleArray(q.options);

    q.answer=q.options.indexOf(correctAnswer);

  });


  currentQuestion=0;
  score=0;
  answered=false;

  document.getElementById("finalScreen").style.display="none";

  document.getElementById("quizCard").style.display="block";

  showQuestion();

}


/* =====================================
   SHOW QUESTION
   ===================================== */

function showQuestion(){

  answered=false;

  const q=quizQuestions[currentQuestion];

  document.getElementById("questionNumber").textContent=
    (currentQuestion+1)+" / "+quizQuestions.length;

  document.getElementById("score").textContent=score;

  document.getElementById("subject").textContent=q.subject;

  document.getElementById("question").textContent=q.q;

  document.getElementById("result").textContent="";

  document.getElementById("nextBtn").style.display="none";


  const progress=
    ((currentQuestion+1)/quizQuestions.length)*100;

  document.getElementById("progressFill").style.width=
    progress+"%";

  document.getElementById("progressPercent").textContent=
    Math.round(progress)+"%";


  const optionsContainer=
    document.getElementById("options");

  optionsContainer.innerHTML="";


  q.options.forEach(function(optionText,index){

    const button=document.createElement("button");

    button.className="option";

    button.textContent=optionText;

    button.onclick=function(){

      checkAnswer(index,button);

    };

    optionsContainer.appendChild(button);

  });

}


/* =====================================
   CHECK ANSWER
   ===================================== */

function checkAnswer(selected,clickedButton){

  if(answered)return;

  answered=true;

  const q=quizQuestions[currentQuestion];

  const buttons=document.querySelectorAll(".option");


  buttons.forEach(function(button){

    button.disabled=true;

  });


  if(selected===q.answer){

    score+=10;

    clickedButton.classList.add("correct");

    document.getElementById("score").textContent=score;

    document.getElementById("result").textContent=
      "🎉 Excellent! Correct Answer! +10 ⭐";

    document.getElementById("result").style.color="#16a34a";

  }

  else{

    clickedButton.classList.add("wrong");

    buttons[q.answer].classList.add("correct");

    document.getElementById("result").textContent=
      "😊 Nice Try! Correct answer: "+q.options[q.answer];

    document.getElementById("result").style.color="#dc2626";

  }


  document.getElementById("nextBtn").style.display="block";

}


/* =====================================
   NEXT QUESTION
   ===================================== */

function nextQuestion(){

  currentQuestion++;

  if(currentQuestion>=quizQuestions.length){

    showFinalScreen();

  }

  else{

    showQuestion();

    window.scrollTo({
      top:0,
      behavior:"smooth"
    });

  }

}


/* =====================================
   FINAL SCREEN
   ===================================== */

function showFinalScreen(){

  document.getElementById("quizCard").style.display="none";

  document.getElementById("finalScreen").style.display="block";

  document.getElementById("finalScore").textContent=
    "Your Score: "+score+" / "+(quizQuestions.length*10);


  let message="";

  if(score>=900){

    message="🏆 Amazing! You are a Quiz Champion!";

  }

  else if(score>=750){

    message="🌟 Excellent Job! Keep it up!";

  }

  else if(score>=600){

    message="👏 Great Work! You are learning well!";

  }

  else if(score>=400){

    message="😊 Good Try! Keep practicing!";

  }

  else{

    message="💪 Don't Give Up! Try Again!";

  }


  document.getElementById("finalMessage").textContent=message;

}


/* =====================================
   PLAY AGAIN
   ===================================== */

function restartQuiz(){

  startQuiz();

}


/* =====================================
   START
   ===================================== */

startQuiz();
