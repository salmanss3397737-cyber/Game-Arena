<title>GameArena - Free Online Games</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#111827,#312e81,#581c87);
  color:white;
  text-align:center;
  min-height:100vh;
}

.container{
  width:100%;

.game-card{

  border-radius:18px;
  padding:22px 15px;
  margin:16px 0;
  font-size:24px;
  font-weight:bold;
}.game-card{
  box-shadow:0 8px 20px rgba(0,0,0,0.3);
  transition:0.2s;
}

.game-card:hover{
  transform:scale(1.03);
  background:rgba(255,255,255,0.2);
}

.leaderboard{
  background:rgba(0,0,0,0.25);
  border-radius:20px;
  padding:20px;
  margin-top:15px;

.player{
