<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GameArena - Registration</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  color:white;

  background:
    radial-gradient(circle at top,#5b21b6,#17102f 45%,#05030d);
}

.container{
  width:100%;
  max-width:470px;
}

.card{
  background:rgba(255,255,255,.09);
  border:1px solid rgba(255,255,255,.18);
  border-radius:28px;
  padding:28px 22px;
  box-shadow:0 15px 40px rgba(0,0,0,.45);
}

.logo{
  text-align:center;
  font-size:38px;
  font-weight:900;
  text-shadow:0 0 20px #a78bfa;
}

.title{
  text-align:center;
  font-size:26px;
  font-weight:900;
  margin-top:10px;
}

.subtitle{
  text-align:center;
  margin-top:7px;
  color:#c4b5fd;
  line-height:1.5;
}

/* FORM */

label{
  display:block;
  margin-top:16px;
  margin-bottom:7px;
  font-weight:bold;
}

input,
select{
  width:100%;
  padding:13px;
  border:2px solid rgba(255,255,255,.18);
  border-radius:14px;
  background:rgba(0,0,0,.28);
  color:white;
  font-size:16px;
  outline:none;
}

input:focus,
select:focus{
  border-color:#8b5cf6;
}

select option{
  color:#111827;
}

/* BUTTON */

button{
  width:100%;
  margin-top:23px;
  padding:15px;
  border:0;
  border-radius:17px;
  background:#22c55e;
  color:white;
  font-size:18px;
  font-weight:900;
  cursor:pointer;
  box-shadow:0 5px 0 #15803d;
}

button:active{
  transform:translateY(3px);
  box-shadow:0 2px 0 #15803d;
}

/* MESSAGE */

.message{
  text-align:center;
  margin-top:16px;
  min-height:22px;
  font-weight:bold;
}

/* LINKS */

.login{
  text-align:center;
  margin-top:20px;
  color:#c4b5fd;
}

.login a{
  color:#ddd6fe;
  font-weight:bold;
}

.home{
  text-align:center;
  margin-top:18px;
}

.home a{
  color:#ddd6fe;
  text-decoration:none;
  font-weight:bold;
}

/* NOTE */

.note{
  margin-top:17px;
  padding:12px;
  border-radius:13px;
  background:rgba(255,255,255,.06);
  color:#c4b5fd;
  font-size:12px;
  line-height:1.5;
  text-align:center;
}

</style>
</head>

<body>

<div class="container">

<div class="card">

  <div class="logo">
    🎮 GameArena
  </div>

  <div class="title">
    📝 Create Account
  </div>

  <div class="subtitle">
    Join GameArena and start playing!
  </div>


  <!-- USERNAME -->

  <label for="username">
    👤 Username
  </label>

  <input
    type="text"
    id="username"
    placeholder="Choose username"
    autocomplete="username"
  >


  <!-- PASSWORD -->

  <label for="password">
    🔐 Password
  </label>

  <input
    type="password"
    id="password"
    placeholder="Create password"
    autocomplete="new-password"
  >


  <!-- FULL NAME -->

  <label for="fullName">
    🧑 Full Name
  </label>

  <input
    type="text"
    id="fullName"
    placeholder="Enter your full name"
  >


  <!-- CLASS -->

  <label for="className">
    🎓 Class
  </label>

  <select id="className">

    <option value="">
      Select Class
    </option>

    <option value="Prep">
      Prep
    </option>

    <option value="Class 1">
      Class 1
    </option>

    <option value="Class 2">
      Class 2
    </option>

    <option value="Class 3">
      Class 3
    </option>

    <option value="Class 4">
      Class 4
    </option>

    <option value="Class 5">
      Class 5
    </option>

    <option value="Class 6">
      Class 6
    </option>

    <option value="Class 7">
      Class 7
    </option>

    <option value="Class 8">
      Class 8
    </option>

    <option value="Class 9">
      Class 9
    </option>

    <option value="Class 10">
      Class 10
    </option>

  </select>


  <!-- SCHOOL -->

  <label for="school">
    🏫 School Name
  </label>

  <input
    type="text"
    id="school"
    placeholder="Enter school name"
  >


  <!-- CITY -->

  <label for="city">
    🏙️ City
  </label>

  <input
    type="text"
    id="city"
    placeholder="Enter your city"
  >


  <!-- MOBILE -->

  <label for="mobile">
    📱 Mobile Number
  </label>

  <input
    type="tel"
    id="mobile"
    placeholder="03XXXXXXXXX"
    inputmode="numeric"
  >


  <!-- REGISTER BUTTON -->

  <button onclick="registerUser()">
    🚀 Create Account
  </button>


  <div class="message" id="message"></div>


  <div class="note">
    🔒 Your mobile number and password will not be shown publicly.
  </div>


  <div class="login">

    Already have an account?

    <a href="Login.html">
      Login
    </a>

  </div>


  <div class="home">

    <a href="index.html">
      🏠 Back to GameArena
    </a>

  </div>

</div>

</div>


<script>

function registerUser(){

  const username =
    document.getElementById("username").value.trim();

  const password =
    document.getElementById("password").value;

  const fullName =
    document.getElementById("fullName").value.trim();

  const className =
    document.getElementById("className").value;

  const school =
    document.getElementById("school").value.trim();

  const city =
    document.getElementById("city").value.trim();

  const mobile =
    document.getElementById("mobile").value.trim();

  const message =
    document.getElementById("message");


  /* CHECK EMPTY FIELDS */

  if(
    username === "" ||
    password === "" ||
    fullName === "" ||
    className === "" ||
    school === "" ||
    city === "" ||
    mobile === ""
  ){

    message.textContent =
      "⚠️ Please fill all fields.";

    message.style.color =
      "#facc15";

    return;

  }


  /* PASSWORD */

  if(password.length < 4){

    message.textContent =
      "⚠️ Password must be at least 4 characters.";

    message.style.color =
      "#facc15";

    return;

  }


  /* MOBILE */

  if(!/^03[0-9]{9}$/.test(mobile)){

    message.textContent =
      "⚠️ Enter a valid Pakistani mobile number.";

    message.style.color =
      "#facc15";

    return;

  }


  /* CHECK EXISTING USER */

  const existingUser =
    localStorage.getItem("gameArenaUser");

  if(existingUser){

    const oldUser =
      JSON.parse(existingUser);

    if(oldUser.username === username){

      message.textContent =
        "⚠️ This username is already registered.";

      message.style.color =
        "#f87171";

      return;

    }

  }


  /* USER DATA */

  const user = {

    username: username,

    password: password,

    fullName: fullName,

    className: className,

    school: school,

    city: city,

    mobile: mobile

  };


  /* SAVE */

  localStorage.setItem(
    "gameArenaUser",
    JSON.stringify(user)
  );


  localStorage.setItem(
    "gameArenaLoggedIn",
    "false"
  );


  message.textContent =
    "✅ Account created successfully!";

  message.style.color =
    "#4ade80";


  /* GO TO LOGIN */

  setTimeout(function(){

    window.location.href =
      "Login.html";

  },1000);

}

</script>

</body>
</html>
